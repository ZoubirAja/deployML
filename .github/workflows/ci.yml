name: ci

on:
  pull_request:
    branches:
      - main

jobs:

  tests:
    runs-on: ubuntu-latest

    steps:

    # Étape 1 — Récupérer le code de la PR
    - name: Checkout du code
      uses: actions/checkout@v4
      # "uses" = utilise une action prédéfinie par GitHub/la communauté
      # actions/checkout = clone ton repo dans la machine virtuelle

    # Étape 2 — Créer le .env pour les tests
    - name: Créer le .env
      run: |
        echo "DB_HOST=db" >> .env.test
        echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env.test
        echo "DB_USER=${{ secrets.DB_USER }}" >> .env.test
        echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env.test
        echo "S3_URL=http://minio:9000" >> .env.test
        echo "S3_KEY=${{ secrets.S3_KEY }}" >> .env.test
        echo "S3_SECRET=${{ secrets.S3_SECRET }}" >> .env.test
        echo "API_KEY=${{ secrets.API_KEY }}" >> .env.test
      # "run" = exécute des commandes shell directement
      # on injecte les variables d'env depuis les secrets GitHub
    - name: Copy env file
      run: cp .env.test .env

    # Étape 3 — Builder et lancer les containers
    - name: Nettoyage Docker
      run: |
        docker compose down -v || true
        docker network prune -f || true
        docker system prune -f || true

    - name: Lancer docker compose
      run: |
        docker compose --env-file .env.test up --build -d

    - name: Vérifier les logs du conteneur API
      run: |
        docker compose --env-file .env.test ps -a
        docker logs deployml-api-1 || true

    - name: Logs du conteneur API
      run: |
        docker logs deployml-api-1 || true

    - name: Debug API
      run: |
        docker compose --env-file .env.test ps -a

        echo "===== API LOGS ====="
        docker compose --env-file .env.test logs api || true

        echo "===== DB LOGS ====="
        docker compose --env-file .env.test logs db || true

        echo "===== MINIO LOGS ====="
        docker compose --env-file .env.test logs minio || true

    - name: Debug immédiat
      run: |
        echo "=== CONTAINERS ==="
        docker compose --env-file .env.test ps -a

        echo "=== LOGS API ==="
        docker compose --env-file .env.test logs api || true

        echo "=== LOGS DB ==="
        docker compose --env-file .env.test logs db || true

        echo "=== LOGS MINIO ==="
        docker compose --env-file .env.test logs minio || true

    # Étape 4 — Attendre que les services soient prêts
    - name: Attendre que l'API soit prête
      run: |
        echo "Attente de l'API..."
        for i in $(seq 1 10); do
          if docker compose --env-file .env.test ps --status running | grep -q api; then
            if docker compose --env-file .env.test exec -T api echo "ok" >/dev/null 2>&1; then
              echo "API prête"
              exit 0
            fi
          fi

          echo "Tentative $i/10..."
          docker compose ps -a
          sleep 10
        done

        echo "API jamais prête"
        docker compose logs api || true
        docker compose logs db || true
        exit 1

    - name: Afficher les logs si problème
      if: failure()   # ← s'exécute UNIQUEMENT si une étape précédente a échoué
      run: docker compose logs api

    - name: Vérifier le fichier .env.test
      run: |
        echo "=== .env.test ==="
        cat .env.test | sed 's/=.*/=***/'

    # Étape 5 — Initialiser la BDD
    - name: Initialiser la BDD
      run: |
        free -h
        docker stats --no-stream
        docker compose ps
        dmesg | tail -50 || true
        docker compose exec -T api python init_db.py
        free -h
        docker stats --no-stream
        docker compose ps
        dmesg | tail -50 || true
      # -T = désactive le TTY, obligatoire dans un environnement CI

    # Étape 6 — Entraîner le modèle
    - name: Entraîner le modèle
      run: docker compose exec -T api python train.py

    # Étape 7 — Lancer les tests avec rapport de couverture
    - name: Lancer les tests pytest
      run: |
        docker compose exec -T api pytest tests/ -v --cov=. --cov-report=xml

    # Étape 8 — Publier le rapport de couverture
    - name: Upload rapport de couverture
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
      # affiche le % de couverture directement dans la PR sur GitHub
  
  deploy-docs:
    runs-on: ubuntu-latest
    needs: tests  # ← attend que les tests passent avant de déployer
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    # ↑ se déclenche uniquement quand la PR est mergée dans main

    steps:

    - name: Checkout du code
      uses: actions/checkout@v4

    - name: Installer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Installer MkDocs
      run: pip install mkdocs-material  # ou juste mkdocs selon ton thème

    - name: Déployer la doc sur HuggingFace
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        mkdocs build
        # ici la commande pour pusher sur HuggingFace
        # ça dépend de comment ton Space HF est configuré