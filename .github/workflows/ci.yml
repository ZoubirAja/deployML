name: ci

on:
  pull_request:
    branches:
      - main

jobs:

  tests:
    runs-on: ubuntu-latest

    steps:

    # Étape 1 — Récupérer le code de la PR
    - name: Checkout du code
      uses: actions/checkout@v4
      # "uses" = utilise une action prédéfinie par GitHub/la communauté
      # actions/checkout = clone ton repo dans la machine virtuelle

    # Étape 2 — Créer le .env pour les tests
    - name: Créer le .env
      run: |
        echo "DB_HOST=db" >> .env
        echo "DB_NAME=${{ SECRETS_CI.DB_NAME }}" >> .env
        echo "DB_USER=${{ SECRETS_CI.DB_USER }}" >> .env
        echo "DB_PASSWORD=${{ SECRETS_CI.DB_PASSWORD }}" >> .env
        echo "S3_URL=http://minio:9000" >> .env
        echo "S3_KEY=${{ SECRETS_CI.S3_KEY }}" >> .env
        echo "S3_SECRET=${{ SECRETS_CI.S3_SECRET }}" >> .env
      # "run" = exécute des commandes shell directement
      # on injecte les variables d'env depuis les secrets GitHub

    # Étape 3 — Builder et lancer les containers
    - name: Lancer docker compose
      run: |
        docker compose up --build -d db minio
        docker compose up --build -d api
      # -d = detached, tourne en arrière plan

    # Étape 4 — Attendre que les services soient prêts
    - name: Attendre que l'API soit prête
      run: |
        echo "Attente de l'API..."
        for i in $(seq 1 10); do
          if docker compose ps --status running | grep -q api; then
            if docker compose exec -T api echo "ok" >/dev/null 2>&1; then
              echo "API prête"
              exit 0
            fi
          fi

          echo "Tentative $i/10..."
          docker compose ps -a
          sleep 10
        done

        echo "API jamais prête"
        docker compose logs api || true
        docker compose logs db || true
        exit 1

    - name: Afficher les logs si problème
      if: failure()   # ← s'exécute UNIQUEMENT si une étape précédente a échoué
      run: docker compose logs api

    # Étape 5 — Initialiser la BDD
    - name: Initialiser la BDD
      run: |
        free -h
        docker stats --no-stream
        docker compose ps
        dmesg | tail -50 || true
        docker compose exec -T api python init_db.py
        free -h
        docker stats --no-stream
        docker compose ps
        dmesg | tail -50 || true
      # -T = désactive le TTY, obligatoire dans un environnement CI

    # Étape 6 — Entraîner le modèle
    - name: Entraîner le modèle
      run: docker compose exec -T api python train.py

    # Étape 7 — Lancer les tests avec rapport de couverture
    - name: Lancer les tests pytest
      run: |
        docker compose exec -T api pytest tests/ -v --cov=. --cov-report=xml

    # Étape 8 — Publier le rapport de couverture
    - name: Upload rapport de couverture
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
      # affiche le % de couverture directement dans la PR sur GitHub